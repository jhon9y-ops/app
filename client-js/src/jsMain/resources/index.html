<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>WebRTC P2P - Kotlin</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; margin: 0; padding: 20px; }
        .video-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        video { width: 45%; max-width: 480px; background: #000; border-radius: 8px; border: 2px solid #333; }
        .controls { margin-top: 20px; }
        input, button { padding: 10px 16px; font-size: 16px; border-radius: 6px; border: none; margin: 5px; }
        button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>WebRTC Kotlin/JS P2P</h1>
    
    <div class="controls">
        <input type="text" id="roomIdInput" value="sala-1" placeholder="Nome da Sala">
        <button id="startBtn">Conectar & Iniciar Câmera</button>
        <button id="callBtn" style="display: none;">Iniciar Chamada (Offer)</button>
    </div>

    <div class="video-container">
        <div>
            <h3>Vídeo Local</h3>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div>
            <h3>Vídeo Remoto</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
